<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyGuide | Courses</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <link rel="stylesheet" href="courses.css">
</head>

<body>

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <div class="profile">
            <div class="avatar" id="userInitial">S</div>
            <h3 id="sidebarName">Student</h3>
            <p id="sidebarDepartment">Computer Science</p>
        </div>

        <nav>

            <a href="dashboard.html">
                <i class="fas fa-house"></i>
                Dashboard
            </a>

            <a href="courses.html" class="active">
                <i class="fas fa-book-open"></i>
                Courses
            </a>

            <a href="#">
                <i class="fas fa-file-lines"></i>
                Notes
            </a>

            <a href="#">
                <i class="fas fa-file-circle-question"></i>
                Past Questions
            </a>

            <a href="#">
                <i class="fas fa-user"></i>
                Profile
            </a>

        </nav>

    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-content">

        <!-- Header -->
        <section class="page-header">

            <div>

                <h1>Courses</h1>

                <p class="page-description"> Browse all learning resources for your department... </p>

                <p class="page-info" id="courseInfo">
                    Computer Science • 200 Level
                </p>

            </div>

            <button class="filter-btn">
                <i class="fas fa-filter"></i>
                Filter
            </button>

        </section>

        <!-- Search -->
        <section class="search-section">

            <div class="search-box">

                <i class="fas fa-search"></i>

                <input
                    type="text"
                    placeholder="Search courses..."
                >

            </div>

        </section>

        <!-- Semester Buttons -->

        <section class="semester-filter">

            <button id="allBtn" class="active">All</button>

            <button id="firstSemesterBtn">1st Semester</button>

            <button id="secondSemesterBtn">2nd Semester</button>

        </section>

        <!-- Stats -->

        <section class="stats">

            <div class="stat-card">

             <h2 id="courseCount">0</h2>

                <p>Courses Available</p>

            </div>

        </section>

        <!-- Course List -->
        
        <section class="courses-container" id="coursesContainer">

        </section>

    </main>
    <script src="coursesDatabase.js"></script>    
    <script src="courses.js"></script>


</body>
</html>
