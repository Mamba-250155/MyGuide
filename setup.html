<!DOCTYPE html>
<html>
<head>
   <link rel="stylesheet" href="style.css" >
   
    <title>MyGuide Setup</title>
</head>
<body>

    <h1>Welcome to MyGuide</h1>

    <form id="setupForm">

        <input
            type="text"
            id="name"
            placeholder="Your Name"
            required>

        <input
            type="text"
            id="department"
            placeholder="Department"
            required>

        <input
            type="text"
            id="level"
            placeholder="Level"
            required>

        <button type="submit">
            Continue
        </button>

    </form>

<script src="setup.js"></script>

</body>
</html>
